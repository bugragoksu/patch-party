name: baglanti_agi
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  characters: 1.4.1
  cloud_firestore: 7.0.0
  cloud_functions: 7.0.0
  crypto: 3.0.7
  firebase_auth: 7.0.0
  firebase_core: 5.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.1.1
  qr_flutter: 4.1.0
  sentry_flutter: 10.2.0
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/brand/
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-800.ttf
          weight: 800
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-700.ttf
          weight: 700
    - family: GoogleSansCode
      fonts:
        - asset: assets/fonts/GoogleSansCode-700.ttf
          weight: 700
