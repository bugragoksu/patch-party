<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Etkinlikler için tanışma oyunu: QR okut, bağlantı kur, ortak soruyu konuş. A QR networking game for tech meetups, open source.">
  <!-- Link previews (LinkedIn, X, WhatsApp). %SITE_URL% is filled in after the
       build by tools/web-meta.mjs from SITE_URL in .env.<env>. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Patch Party">
  <meta property="og:title" content="Patch Party: tanışmayı oyuna çevir">
  <meta property="og:description" content="Etkinlikler için QR tanışma oyunu. Telefondan katıl, birbirini okut, ortak soruyla konuş; ağ projeksiyonda canlı büyür. Açık kaynak, Flutter web + Firebase.">
  <meta property="og:url" content="%SITE_URL%/">
  <meta property="og:image" content="%SITE_URL%/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="627">
  <meta property="og:image:alt" content="Patch Party logosu ve 'Tanışmayı oyuna çevir' yazısı">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Patch Party: tanışmayı oyuna çevir">
  <meta name="twitter:description" content="QR networking game for tech meetups. Open source, Flutter web + Firebase.">
  <meta name="twitter:image" content="%SITE_URL%/brand/og-image.png">
  <meta name="theme-color" content="#1C1B1F">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Patch Party">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Patch Party</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1C1B1F; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #F6F4EE;
      transition: opacity .25s ease-out;
    }
    #splash .card {
      background: #F6F4EE; color: #141414; border: 3px solid #141414; border-radius: 18px;
      box-shadow: 6px 6px 0 #FBBC04; transform: rotate(-2deg);
      padding: 14px 22px; font-weight: 800; font-size: 26px; letter-spacing: -.02em;
    }
    #splash .mark { margin-bottom: -6px; }
    #splash .hint { font-size: 14px; color: #B9B4AA; }
    #splash .tip {
      max-width: 280px; min-height: 64px; box-sizing: border-box; padding: 12px 16px;
      border: 2px dashed #3A373F; border-radius: 14px; text-align: center;
      font-size: 15px; line-height: 1.4; color: #F6F4EE; transition: opacity .2s ease-out;
    }
    #splash .tip b { color: #FBBC04; }
    #splash .bar { width: 160px; height: 8px; border: 2px solid #F6F4EE; border-radius: 999px; overflow: hidden; }
    #splash .bar i { display: block; height: 100%; width: 40%; background: #34A853; animation: load 1.1s ease-in-out infinite alternate; }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img class="mark" src="brand/mark.svg" width="96" height="96" alt="">
    <div class="card">Patch Party</div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="hint">Oyun yükleniyor…</div>
    <p class="tip" id="splash-tip"><b>İpucu:</b> QR'ını okutan kişi de onaylayınca bağlantı kurulur.</p>
  </div>
  <script src="boot.js"></script>
  <script src="scanner.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
